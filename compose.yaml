services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:8080:3000"
    init: true
    read_only: true
    # Next.js writes its image-optimization cache under .next/cache; the root filesystem is read-only.
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
